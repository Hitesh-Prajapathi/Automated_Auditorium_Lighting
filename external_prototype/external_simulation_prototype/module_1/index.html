<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Auditorium - LIVE CONSOLE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a;
        }

        canvas {
            display: block;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.5rem;
            z-index: 100;
        }

        /* CONSOLE PANEL (Bottom) */
        #consolePanel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            /* TALLER as requested */
            background: #111;
            border-top: 2px solid #00d4ff;
            display: flex;
            z-index: 90;
        }

        .cue-list {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background: #000;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cue-item {
            padding: 8px 15px;
            color: #555;
            font-size: 0.95rem;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .cue-item:hover {
            background: #222;
            color: #aaa;
        }

        .cue-item.active {
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(0, 212, 255, 0.15);
            border-left: 4px solid #00d4ff;
            padding: 15px;
        }

        .cue-scene {
            float: right;
            font-family: monospace;
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #ffa500;
            font-weight: bold;
        }

        .cue-item.active .cue-scene {
            background: #ffa500;
            color: #000;
            font-size: 1rem;
        }

        /* BUTTONS */
        .controls {
            width: 280px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
            border-left: 1px solid #333;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .console-btn {
            flex: 1;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            transition: transform 0.1s;
            font-size: 1rem;
        }

        .console-btn:active {
            transform: scale(0.95);
        }

        .btn-prev {
            background: #444;
        }

        .btn-hold {
            background: #d4a000;
            color: #000;
        }

        .btn-hold.active {
            background: #ff0000;
            color: #fff;
            animation: pulse 1s infinite;
        }

        .btn-next {
            background: #00d4ff;
            color: #000;
            font-size: 1.4rem;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        /* FIXTURE STATUS SIDEBAR - Always Visible now? Or Toggleable but better styled */
        #fixturePanel {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            height: calc(100vh - 300px);
            /* Fill space above console */
            background: rgba(10, 10, 15, 0.9);
            border-left: 1px solid #333;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        #fixtureHeader {
            padding: 10px;
            background: #1a1a1a;
            color: #fff;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        #fixtureList {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .fixture-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            margin-bottom: 2px;
            background: #222;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #aaa;
        }

        .fixture-val {
            font-family: monospace;
            color: #fff;
        }

        .f-group {
            margin-top: 10px;
            margin-bottom: 4px;
            color: #00d4ff;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="loading">Connecting to Console...</div>

    <!-- FIXTURE STATUS PANEL -->
    <div id="fixturePanel">
        <div id="fixtureHeader">💡 REAL-TIME STATUS</div>
        <div id="fixtureList">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- CONSOLE INTERFACE -->
    <div id="consolePanel">
        <div class="cue-list" id="cueList">
            <!-- Cues go here -->
        </div>

        <div class="controls">
            <div class="btn-row">
                <button class="console-btn btn-prev" onclick="sendCommand('PREV')">⏮ PREV</button>
                <button class="console-btn btn-hold" id="btnHold" onclick="sendCommand('HOLD')">⏸ HOLD</button>
            </div>
            <div class="btn-row">
                <button class="console-btn btn-next" onclick="sendCommand('NEXT')">GO ⏭</button>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./js/main.js?v=6"></script>
</body>

</html>
